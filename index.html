<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RNZ Foodies</title>
  <meta name="theme-color" content="#E63946">
  <link rel="manifest" href="manifest.json">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar sticky-top bg-white border-bottom">
    <div class="container">
      <span class="navbar-brand fw-bold text-primary-red">RNZ Ordering</span>
      <div>
        <button class="btn btn-outline-secondary btn-sm me-2" data-bs-toggle="modal" data-bs-target="#loginModal">Login</button>
        <button class="btn btn-red btn-sm" data-bs-toggle="offcanvas" data-bs-target="#cartPanel">
          Cart (<span id="cartCount">0</span>)
        </button>
      </div>
    </div>
  </nav>

  <!-- Menu -->
  <main class="container py-4">
    <div id="categories" class="mb-3 d-flex gap-2 flex-wrap"></div>
    <div id="menu" class="row g-3"></div>
  </main>

  <!-- Cart + Checkout -->
  <div class="offcanvas offcanvas-end" id="cartPanel">
    <div class="offcanvas-header">
      <h5>Your cart</h5>
      <button class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column">
      <div id="cartItems" class="flex-grow-1"></div>
      <h6>Total: ₱<span id="cartTotal">0</span></h6>
      <select id="payment" class="form-select my-2">
        <option>GCash</option>
        <option>Maya</option>
        <option>PayPal</option>
      </select>
      <button id="checkoutBtn" class="btn btn-red w-100">Place order</button>
    </div>
  </div>

  <!-- Login / Register -->
  <div class="modal fade" id="loginModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content p-3">
        <h5 id="authTitle">Login</h5>
        <input id="email" type="email" class="form-control my-2" placeholder="Email">
        <input id="password" type="password" class="form-control my-2" placeholder="Password">
        <button id="authBtn" class="btn btn-red w-100">Login</button>
        <div class="d-flex justify-content-between mt-2 small">
          <a href="#" id="toggleAuth">Create an account</a>
          <a href="#" id="forgotLink">Forgot password?</a>
        </div>
      </div>
    </div>
  </div>

  <!-- 2FA -->
  <div class="modal fade" id="twoFAModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content p-3">
        <h5>Enter your 6-digit code</h5>
        <input id="code" class="form-control text-center my-2" maxlength="6" placeholder="000000">
        <button id="verifyBtn" class="btn btn-red w-100">Verify</button>
      </div>
    </div>
  </div>

  <!-- Order confirmation -->
  <div class="modal fade" id="confirmModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content p-4 text-center">
        <h5>Order placed</h5>
        <p id="confirmText"></p>
        <button class="btn btn-red" data-bs-dismiss="modal">Done</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
